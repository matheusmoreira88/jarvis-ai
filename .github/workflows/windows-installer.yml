name: Build Windows installer
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[build]"
      - name: Run regression checks
        run: python -m unittest discover -s tests -v
      - name: Build standalone application
        run: python -m PyInstaller --noconfirm --clean JarvisAI.spec
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build setup installer
        shell: pwsh
        run: |
          $compiler = Get-Command ISCC.exe -ErrorAction Stop
          & $compiler.Source installer/JarvisAI.iss
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-AI-Windows-Setup
          path: dist/installer/JARVIS-AI-Setup-*.exe
          if-no-files-found: error

      - name: Publish installer as a GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/JARVIS-AI-Setup-*.exe
          generate_release_notes: true
