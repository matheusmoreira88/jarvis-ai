[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-ai-desktop"
version = "0.8.0"
description = "Assistente pessoal para desktop em português"
requires-python = ">=3.11"
license = "MIT"
license-files = ["license"]
dependencies = ["PySide6>=6.8", "vosk>=0.3.45", "PySide6-WebEngine>=6.8", "google-genai>=1.0", "keyring>=25", "platformdirs>=4", "sounddevice>=0.5", "numpy>=1.26", "Pillow>=10", "mss>=9", "pyautogui>=0.9.54", "pyttsx3>=2.90", "yt-dlp>=2025.1.0", "google-auth-oauthlib>=1.2", "psutil>=6", "tzdata>=2025.2"]

[project.optional-dependencies]
build = ["pyinstaller>=6.22"]

[project.scripts]
jarvis-ai = "jarvis.app:main"

[tool.setuptools.packages.find]
where = ["src"]
