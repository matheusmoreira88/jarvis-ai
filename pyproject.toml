[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-ai-desktop"
version = "0.1.0"
description = "Assistente pessoal para desktop em português"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["PySide6>=6.8", "PySide6-WebEngine>=6.8", "google-genai>=1.0", "keyring>=25", "platformdirs>=4", "groq>=0.11", "sounddevice>=0.5", "numpy>=1.26", "Pillow>=10", "mss>=9", "pyautogui>=0.9.54", "pyttsx3>=2.90", "yt-dlp>=2025.1.0", "google-api-python-client>=2.120", "google-auth-oauthlib>=1.2", "google-auth-httplib2>=0.2"]

[project.scripts]
jarvis-ai = "jarvis.app:main"

[tool.setuptools.packages.find]
where = ["src"]
